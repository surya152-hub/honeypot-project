<!DOCTYPE html>
<html>
<head>
    <title>Honeypot Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
 


<h1>🔥 Honeypot Dashboard</h1>
 
<h2 id="total"></h2>
 
<input type="text" id="ipFilter" placeholder="Filter by IP..." onkeyup="filterByIP()" />
 
<table border="1" width="100%" >
    <thead>
        <tr>
            <th>Time</th>
            <th>IP</th>
            <th>Method</th>
            <th>URL</th>
        </tr>
    </thead> <tbody id="logTable">
    </tbody>
    </tbody>
</table>


<button onclick="window.location.href='/ai-summary'"
style="background:purple;color:white;padding:8px 16px;border:none;border-radius:5px;">
AI Summary
</button>

<button onclick="window.location.href='/clear-logs'"
style="background:red;color:white;padding:8px 16px;border:none;border-radius:5px;">
Clear Logs
</button>


 
<button onclick="window.location.href='/logout'" class="logout-btn">
    Logout
</button>
 
<script>
let allData = [];
 
fetch("/api/logs")
.then(res => res.json())
.then(data => {
    allData = data;
    document.getElementById("total").innerText =
        "Total Attacks: " + data.length;
    renderTable(data);
});
 
function renderTable(data) {
    const tbody = document.getElementById("logTable");
    tbody.innerHTML = "";
 
    data.forEach(log => {
        const row = `
            <tr>
                <td>${log.time}</td>
                <td>${log.ip}</td>
                <td>${log.method}</td>
                <td>${log.url}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    });


    const ipCount = {};
 
    data.forEach(log => {
        ipCount[log.ip] = (ipCount[log.ip] || 0) + 1;
    });
 
    for (let ip in ipCount) {
        if (ipCount[ip] > 10) {
            alert("⚠️ Suspicious IP detected: " + ip);
        }
    }
}
 
function filterByIP() {
    const searchIP = document.getElementById("ipFilter").value;
    const filtered = allData.filter(log =>
        log.ip.includes(searchIP)
    );
    renderTable(filtered);
}
</script>

 
</body>
</html>
